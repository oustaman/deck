<svg viewBox="0 0 340 135" role="img" aria-labelledby="f2t">
    <title id="f2t">Before: places identified by codes such as Building 4, Floor 2, Area 17, and Exit 3-B. After: places named after cities, such as Nanjing, and safety exits named after classical poets, such as Du Fu.</title>
    <text x="0" y="12" font-size="11" font-weight="600">How a place was identified</text>
    <text x="0" y="40" font-size="10" fill="#555">BEFORE</text>
    <rect x="0" y="48" width="140" height="44" fill="none" stroke="#111" stroke-width="1"/>
    <text x="10" y="66" font-size="12">Building 4 · Floor 2</text>
    <text x="10" y="83" font-size="12">Area 17 · Exit 3-B</text>
    <text x="160" y="76" font-size="18">→</text>
    <text x="190" y="40" font-size="10" fill="#555">AFTER</text>
    <rect x="190" y="48" width="150" height="44" fill="#111"/>
    <text x="200" y="68" font-size="15" font-weight="700" fill="#fff" style="fill:#fff">南京 Nanjing</text>
    <text x="200" y="84" font-size="11" fill="#fff" style="fill:#fff">Exit: ← 杜甫 Du Fu</text>
    <text x="0" y="122" font-size="11">Codes have to be learned.</text>
    <text x="190" y="122" font-size="11">Names are already known.</text>
  </svg>